<!DOCTYPE html>
<html lang="ja" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flash Cards — New Crown 2</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;700;800&display=swap');

  /* ── THEME TOKENS ── */
  :root[data-theme="dark"] {
    --bg:        #111318;
    --surface:   #1c1f27;
    --surface2:  #252932;
    --border:    #333848;
    --border2:   #444c60;
    --text:      #eef0f6;
    --text-dim:  #8890a8;
    --text-faint:#4a5068;
    --accent:    #6c8ef5;
    --accent-bg: rgba(108,142,245,0.12);
    --green:     #3ecf8e;
    --green-bg:  rgba(62,207,142,0.12);
    --red:       #f56565;
    --red-bg:    rgba(245,101,101,0.12);
    --yellow:    #f0c060;
    --yellow-bg: rgba(240,192,96,0.1);
    --shadow:    0 2px 12px rgba(0,0,0,0.4);
    --shadow-lg: 0 8px 32px rgba(0,0,0,0.5);
    --card-front:#1c1f27;
    --card-back: #1a2235;
    --toggle-bg: #252932;
  }
  :root[data-theme="light"] {
    --bg:        #f4f6fb;
    --surface:   #ffffff;
    --surface2:  #f0f3fa;
    --border:    #dde2ef;
    --border2:   #c8d0e4;
    --text:      #1a1d2e;
    --text-dim:  #5a6280;
    --text-faint:#a0a8c0;
    --accent:    #4a72e8;
    --accent-bg: rgba(74,114,232,0.1);
    --green:     #1fad72;
    --green-bg:  rgba(31,173,114,0.1);
    --red:       #e03e3e;
    --red-bg:    rgba(224,62,62,0.1);
    --yellow:    #c08020;
    --yellow-bg: rgba(192,128,32,0.1);
    --shadow:    0 2px 12px rgba(0,0,0,0.08);
    --shadow-lg: 0 8px 32px rgba(0,0,0,0.12);
    --card-front:#ffffff;
    --card-back: #f0f5ff;
    --toggle-bg: #e8ecf5;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans JP', 'Inter', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    transition: background 0.25s, color 0.25s;
    padding-bottom: 60px;
  }

  .container {
    width: 100%;
    max-width: 600px;
    padding: 0 20px;
  }

  /* ── TOP BAR ── */
  .top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 0 0;
    margin-bottom: 4px;
  }
  .back-link {
    font-size: 14px;
    font-weight: 600;
    color: var(--text-dim);
    text-decoration: none;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: color 0.15s;
  }
  .back-link:hover { color: var(--accent); }

  /* THEME TOGGLE */
  .theme-toggle {
    background: var(--toggle-bg);
    border: 1.5px solid var(--border);
    border-radius: 99px;
    padding: 6px 14px;
    font-size: 14px;
    cursor: pointer;
    color: var(--text-dim);
    display: flex;
    align-items: center;
    gap: 6px;
    transition: all 0.15s;
    font-family: inherit;
    font-weight: 500;
  }
  .theme-toggle:hover { border-color: var(--accent); color: var(--text); }

  /* ── TITLE ── */
  .title-block {
    text-align: center;
    padding: 24px 0 28px;
  }
  .title-icon { font-size: 40px; display: block; margin-bottom: 10px; }
  .title-jp {
    font-size: 26px;
    font-weight: 800;
    color: var(--text);
    line-height: 1.3;
  }
  .title-en {
    font-size: 13px;
    color: var(--text-dim);
    margin-top: 5px;
    font-weight: 500;
    letter-spacing: 0.05em;
  }

  /* ── SCREENS ── */
  .screen { display: none; }
  .screen.active { display: block; }

  /* ── SETUP ── */
  .setup-panel {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 16px;
    padding: 24px 22px;
    margin-bottom: 16px;
    box-shadow: var(--shadow);
  }
  .setup-label {
    font-size: 11px;
    font-weight: 700;
    color: var(--text-faint);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 16px;
    display: block;
  }

  .mode-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .mode-btn {
    background: var(--surface2);
    border: 2px solid var(--border);
    color: var(--text);
    border-radius: 12px;
    padding: 20px 14px;
    cursor: pointer;
    font-family: inherit;
    font-weight: 700;
    font-size: 16px;
    text-align: center;
    transition: all 0.15s;
    line-height: 1.4;
  }
  .mode-btn .mode-icon { font-size: 32px; display: block; margin-bottom: 8px; }
  .mode-btn .mode-sub { font-size: 12px; color: var(--text-dim); font-weight: 500; display: block; margin-top: 4px; }
  .mode-btn:hover { border-color: var(--accent); background: var(--accent-bg); }
  .mode-btn.selected { border-color: var(--accent); background: var(--accent-bg); color: var(--accent); }
  .mode-btn.selected .mode-sub { color: var(--accent); opacity: 0.8; }

  /* lesson selector */
  .lesson-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 4px; }
  .lesson-btn {
    background: var(--surface2);
    border: 2px solid var(--border);
    color: var(--text);
    border-radius: 10px;
    padding: 14px 10px;
    cursor: pointer;
    font-family: inherit;
    font-weight: 700;
    font-size: 15px;
    text-align: center;
    transition: all 0.15s;
  }
  .lesson-btn .l-icon { font-size: 22px; display: block; margin-bottom: 5px; }
  .lesson-btn .l-sub { font-size: 12px; color: var(--text-dim); font-weight: 500; display: block; margin-top: 3px; }
  .lesson-btn:hover { border-color: var(--accent); }
  .lesson-btn.selected { border-color: var(--accent); background: var(--accent-bg); color: var(--accent); }
  .lesson-btn-wide {
    grid-column: span 2;
    background: var(--surface2);
    border: 2px solid var(--border);
    color: var(--text);
    border-radius: 10px;
    padding: 14px 10px;
    cursor: pointer;
    font-family: inherit;
    font-weight: 700;
    font-size: 15px;
    text-align: center;
    transition: all 0.15s;
  }
  .lesson-btn-wide .l-sub { font-size: 12px; color: var(--text-dim); font-weight: 500; display: block; margin-top: 3px; }
  .lesson-btn-wide:hover { border-color: var(--accent); }
  .lesson-btn-wide.selected { border-color: var(--accent); background: var(--accent-bg); color: var(--accent); }

  /* count selector */
  .count-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .count-btn {
    background: var(--surface2);
    border: 2px solid var(--border);
    color: var(--text-dim);
    border-radius: 10px;
    padding: 14px 4px;
    cursor: pointer;
    font-family: inherit;
    font-size: 16px;
    font-weight: 700;
    text-align: center;
    transition: all 0.15s;
  }
  .count-btn:hover { border-color: var(--yellow); color: var(--yellow); }
  .count-btn.selected { border-color: var(--yellow); background: var(--yellow-bg); color: var(--yellow); }

  .start-btn {
    display: block; width: 100%;
    background: var(--accent); color: #fff;
    border: none; padding: 18px 20px;
    font-family: inherit; font-size: 17px; font-weight: 700;
    cursor: pointer; border-radius: 12px;
    transition: all 0.15s;
    box-shadow: 0 4px 16px rgba(108,142,245,0.3);
    margin-top: 4px;
  }
  .start-btn:hover { filter: brightness(1.1); transform: translateY(-1px); box-shadow: 0 6px 20px rgba(108,142,245,0.4); }
  .start-btn:active { transform: translateY(1px); }
  .start-btn:disabled { opacity: 0.4; cursor: default; transform: none; }

  /* ── PROGRESS ── */
  .prog-row { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
  .prog-bar { flex: 1; height: 6px; background: var(--surface2); border-radius: 99px; overflow: hidden; }
  .prog-fill { height: 100%; background: var(--accent); border-radius: 99px; transition: width 0.4s; }
  .prog-label { font-size: 14px; font-weight: 600; color: var(--text-dim); white-space: nowrap; }
  .score-row { display: flex; gap: 10px; margin-bottom: 18px; }
  .score-pill {
    flex: 1; text-align: center;
    font-size: 15px; font-weight: 700;
    padding: 8px 10px; border-radius: 10px;
    border: 1.5px solid var(--border);
    background: var(--surface);
  }
  .score-pill.cor { color: var(--green); border-color: var(--green); background: var(--green-bg); }
  .score-pill.wrn { color: var(--red); border-color: var(--red); background: var(--red-bg); }
  .score-pill.tot { color: var(--text-dim); }

  /* ── FLASH CARD ── */
  .card-wrap { perspective: 1200px; margin-bottom: 20px; cursor: pointer; }
  .card-inner {
    position: relative; width: 100%; height: 240px;
    transform-style: preserve-3d;
    transition: transform 0.4s cubic-bezier(0.4,0,0.2,1);
  }
  .card-inner.flipped { transform: rotateY(180deg); }
  .card-face {
    position: absolute; width: 100%; height: 100%;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    border: 2px solid var(--border);
    border-radius: 20px;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 28px 24px; text-align: center;
    box-shadow: var(--shadow);
  }
  .card-front { background: var(--card-front); border-color: var(--accent); }
  .card-back { background: var(--card-back); border-color: var(--green); transform: rotateY(180deg); }
  .card-tag {
    font-size: 11px; font-weight: 700; letter-spacing: 0.1em;
    text-transform: uppercase; margin-bottom: 16px;
    padding: 4px 12px; border-radius: 99px;
  }
  .card-front .card-tag { background: var(--accent-bg); color: var(--accent); }
  .card-back .card-tag { background: var(--green-bg); color: var(--green); }
  .card-word { font-size: clamp(28px, 9vw, 44px); font-weight: 800; line-height: 1.2; }
  .card-front .card-word { color: var(--text); }
  .card-back .card-word { color: var(--green); }
  .card-tap-hint {
    font-size: 12px; color: var(--text-faint); margin-top: 16px;
    font-weight: 500;
    animation: blink 1.8s ease-in-out infinite;
  }
  @keyframes blink { 0%,100%{opacity:0.4} 50%{opacity:1} }

  /* flashcard nav */
  .card-nav { display: flex; gap: 14px; margin-bottom: 16px; }
  .nav-btn {
    flex: 1; padding: 20px 14px;
    border: 2px solid var(--border);
    background: var(--surface); color: var(--text);
    border-radius: 14px; cursor: pointer;
    font-family: inherit; font-size: 16px; font-weight: 700;
    transition: all 0.12s; text-align: center;
    box-shadow: var(--shadow);
  }
  .nav-btn .nav-sub { display: block; font-size: 12px; font-weight: 500; color: var(--text-dim); margin-top: 4px; }
  .nav-btn.know { border-color: var(--green); color: var(--green); }
  .nav-btn.know:hover { background: var(--green-bg); }
  .nav-btn.again { border-color: var(--red); color: var(--red); }
  .nav-btn.again:hover { background: var(--red-bg); }
  .nav-btn:disabled { opacity: 0.3; cursor: default; }

  /* ── TYPING MODE ── */
  .type-card {
    background: var(--surface);
    border: 2px solid var(--accent);
    border-radius: 20px;
    padding: 36px 24px;
    text-align: center;
    margin-bottom: 18px;
    box-shadow: var(--shadow);
  }
  .type-tag {
    font-size: 11px; font-weight: 700; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--accent);
    background: var(--accent-bg); padding: 4px 12px;
    border-radius: 99px; display: inline-block; margin-bottom: 16px;
  }
  .type-word { font-size: clamp(32px, 10vw, 50px); font-weight: 800; color: var(--text); margin-bottom: 6px; }
  .type-num { font-size: 13px; color: var(--text-dim); font-weight: 500; }

  .input-row { display: flex; gap: 10px; margin-bottom: 14px; }
  .type-input {
    flex: 1;
    background: var(--surface);
    border: 2px solid var(--border);
    color: var(--text);
    padding: 14px 18px;
    border-radius: 12px;
    font-family: inherit;
    font-size: 20px; font-weight: 700;
    outline: none;
    transition: border-color 0.15s;
    box-shadow: var(--shadow);
  }
  .type-input:focus { border-color: var(--accent); }
  .type-input.correct { border-color: var(--green); background: var(--green-bg); color: var(--green); }
  .type-input.wrong   { border-color: var(--red);   background: var(--red-bg); }
  .type-input:disabled { opacity: 0.85; cursor: default; }

  .submit-btn {
    background: var(--accent); color: #fff;
    border: none; padding: 14px 20px; border-radius: 12px;
    font-family: inherit; font-size: 15px; font-weight: 700;
    cursor: pointer; transition: all 0.12s; white-space: nowrap;
  }
  .submit-btn:hover { filter: brightness(1.1); }
  .submit-btn:disabled { opacity: 0.4; cursor: default; }

  .feedback-box {
    padding: 14px 18px; border-radius: 12px;
    font-size: 16px; font-weight: 600;
    margin-bottom: 14px; display: none; line-height: 1.5;
  }
  .feedback-box.ok { display: block; background: var(--green-bg); color: var(--green); border: 1.5px solid var(--green); }
  .feedback-box.ng { display: block; background: var(--red-bg); color: var(--red); border: 1.5px solid var(--red); }

  .next-btn {
    display: none; width: 100%;
    background: var(--surface2); color: var(--text);
    border: 2px solid var(--border); padding: 16px;
    font-family: inherit; font-size: 16px; font-weight: 700;
    cursor: pointer; border-radius: 12px;
    transition: all 0.12s; margin-bottom: 10px;
  }
  .next-btn.visible { display: block; }
  .next-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ── RESULT ── */
  .result-wrap { text-align: center; padding: 24px 0; }
  .result-emoji { font-size: 80px; display: block; margin-bottom: 14px; animation: rb 0.5s; }
  @keyframes rb { 0%{transform:scale(0)} 60%{transform:scale(1.15)} 100%{transform:scale(1)} }
  .result-title { font-size: 26px; font-weight: 800; margin-bottom: 6px; color: var(--text); }
  .result-sub { font-size: 15px; color: var(--text-dim); margin-bottom: 24px; }
  .result-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 18px 0; }
  .r-stat { background: var(--surface); border: 1.5px solid var(--border); border-radius: 14px; padding: 18px 14px; text-align: center; box-shadow: var(--shadow); }
  .r-val { font-size: 28px; font-weight: 800; display: block; margin-bottom: 5px; }
  .r-label { font-size: 13px; color: var(--text-dim); font-weight: 500; }

  .missed-block { background: var(--surface); border: 1.5px solid var(--border); border-radius: 14px; padding: 16px; margin: 14px 0; max-height: 240px; overflow-y: auto; text-align: left; box-shadow: var(--shadow); }
  .missed-title { font-size: 12px; font-weight: 700; color: var(--red); margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.08em; }
  .missed-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 16px; gap: 12px; }
  .missed-row:last-child { border-bottom: none; }
  .missed-jp { color: var(--text-dim); }
  .missed-en { color: var(--green); font-weight: 700; }

  /* ── BUTTONS ── */
  .btn-primary {
    display: block; width: 100%;
    background: var(--accent); color: #fff;
    border: none; padding: 18px 20px;
    font-family: inherit; font-size: 17px; font-weight: 700;
    cursor: pointer; border-radius: 12px; margin-bottom: 12px;
    transition: all 0.15s;
    box-shadow: 0 4px 16px rgba(108,142,245,0.3);
  }
  .btn-primary:hover { filter: brightness(1.1); transform: translateY(-1px); }

  .btn-secondary {
    display: block; width: 100%;
    background: transparent; color: var(--text-dim);
    border: 2px solid var(--border); padding: 16px 20px;
    font-family: inherit; font-size: 15px; font-weight: 600;
    cursor: pointer; border-radius: 12px; margin-bottom: 10px;
    transition: all 0.15s;
  }
  .btn-secondary:hover { border-color: var(--text-dim); color: var(--text); }

  /* back-to-setup separator */
  .back-sep { margin-top: 32px; padding-top: 24px; border-top: 1.5px solid var(--border); }

  /* flash feedback */
  .damage-flash { position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:999;opacity:0;transition:opacity 0.1s; }
  .damage-flash.cor-flash { background:rgba(62,207,142,0.1); }
  .damage-flash.wrn-flash { background:rgba(245,101,101,0.14); }
  .damage-flash.show { opacity:1; }
</style>
</head>
<body>
<div class="damage-flash" id="dmgFlash"></div>

<div class="container">

  <div class="top-bar">
    <a class="back-link" href="index.html">← Back</a>
    <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">🌙 Dark</button>
  </div>

  <div class="title-block">
    <span class="title-icon">🃏</span>
    <div class="title-jp">フラッシュカード</div>
    <div class="title-en">Flash Cards — New Crown 2</div>
  </div>

  <!-- ══ SETUP ══ -->
  <div class="screen active" id="setupScreen">

    <div class="setup-panel">
      <span class="setup-label">📚 Lesson</span>
      <div class="lesson-grid">
        <button class="lesson-btn selected" id="lessonL1" onclick="selectLesson('L1')">
          <span class="l-icon">1️⃣</span>
          Lesson 1
          <span class="l-sub">24 words</span>
        </button>
        <button class="lesson-btn" id="lessonL2" onclick="selectLesson('L2')">
          <span class="l-icon">2️⃣</span>
          Lesson 2
          <span class="l-sub">32 words</span>
        </button>
        <button class="lesson-btn-wide" id="lessonALL" onclick="selectLesson('ALL')">
          🔀 両方 / Both Lessons
          <span class="l-sub">56 words mixed</span>
        </button>
      </div>
    </div>

    <div class="setup-panel">
      <span class="setup-label">🎮 Mode</span>
      <div class="mode-grid">
        <button class="mode-btn selected" id="modeFlash" onclick="selectMode('flash')">
          <span class="mode-icon">🃏</span>
          フラッシュカード
          <span class="mode-sub">Tap to flip</span>
        </button>
        <button class="mode-btn" id="modeType" onclick="selectMode('type')">
          <span class="mode-icon">⌨️</span>
          タイピング
          <span class="mode-sub">Type the answer</span>
        </button>
      </div>
    </div>

    <div class="setup-panel">
      <span class="setup-label">🔢 How many words?</span>
      <div class="count-grid">
        <button class="count-btn selected" onclick="selectCount(10)">10</button>
        <button class="count-btn" onclick="selectCount(20)">20</button>
        <button class="count-btn" onclick="selectCount(30)">30</button>
        <button class="count-btn" onclick="selectCount(99)">ALL</button>
      </div>
    </div>

    <button class="start-btn" id="startBtn" onclick="startSession()">▶ START</button>
  </div>

  <!-- ══ FLASH SCREEN ══ -->
  <div class="screen" id="flashScreen">
    <div class="prog-row">
      <div class="prog-bar"><div class="prog-fill" id="flashProgFill" style="width:0%"></div></div>
      <div class="prog-label" id="flashProgLabel">0 / 0</div>
    </div>
    <div class="score-row">
      <div class="score-pill cor" id="flashKnow">✓ 0</div>
      <div class="score-pill tot" id="flashRemain">⟳ 0</div>
      <div class="score-pill wrn" id="flashAgain">✗ 0</div>
    </div>

    <div class="card-wrap" id="cardWrap" onclick="flipCard()">
      <div class="card-inner" id="cardInner">
        <div class="card-face card-front">
          <div class="card-tag">🇯🇵 Japanese</div>
          <div class="card-word" id="cardJP">—</div>
          <div class="card-tap-hint">Tap to reveal →</div>
        </div>
        <div class="card-face card-back">
          <div class="card-tag">🇬🇧 English</div>
          <div class="card-word" id="cardEN">—</div>
          <div class="card-hint" id="cardHint"></div>
        </div>
      </div>
    </div>

    <div class="card-nav">
      <button class="nav-btn again" id="btnAgain" onclick="markCard(false)" disabled>
        ✗ もう一度
        <span class="nav-sub">Again</span>
      </button>
      <button class="nav-btn know" id="btnKnow" onclick="markCard(true)" disabled>
        ✓ わかった！
        <span class="nav-sub">Got it</span>
      </button>
    </div>

    <div class="back-sep">
      <button class="btn-secondary" onclick="goSetup()">← 設定に戻る</button>
    </div>
  </div>

  <!-- ══ TYPING SCREEN ══ -->
  <div class="screen" id="typeScreen">
    <div class="prog-row">
      <div class="prog-bar"><div class="prog-fill" id="typeProgFill" style="width:0%"></div></div>
      <div class="prog-label" id="typeProgLabel">0 / 0</div>
    </div>
    <div class="score-row">
      <div class="score-pill cor" id="typeScore">✓ 0</div>
      <div class="score-pill wrn" id="typeWrong">✗ 0</div>
      <div class="score-pill tot" id="typeStreak">🔥 0</div>
    </div>

    <div class="type-card">
      <div class="type-tag">Type the English word</div>
      <div class="type-word" id="typeWord">—</div>
      <div class="type-num" id="typeNum"></div>
    </div>

    <div class="input-row">
      <input class="type-input" id="typeInput" type="text" placeholder="type here…"
        autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
        onkeydown="handleTypeKey(event)">
      <button class="submit-btn" id="submitBtn" onclick="submitType()">Check</button>
    </div>

    <div class="feedback-box" id="typeFeedback"></div>
    <button class="next-btn" id="typeNextBtn" onclick="typeNext()">Next word →</button>

    <div class="back-sep">
      <button class="btn-secondary" onclick="goSetup()">← 設定に戻る</button>
    </div>
  </div>

  <!-- ══ RESULT ══ -->
  <div class="screen" id="resultScreen">
    <div class="result-wrap">
      <span class="result-emoji" id="resultEmoji">🏆</span>
      <div class="result-title" id="resultTitle">—</div>
      <div class="result-sub" id="resultSub">—</div>

      <div class="result-stats">
        <div class="r-stat">
          <span class="r-val" id="rCorrect" style="color:var(--green)">0</span>
          <div class="r-label">正解 / Correct</div>
        </div>
        <div class="r-stat">
          <span class="r-val" id="rWrong" style="color:var(--red)">0</span>
          <div class="r-label">不正解 / Wrong</div>
        </div>
        <div class="r-stat">
          <span class="r-val" id="rPct" style="color:var(--accent)">0%</span>
          <div class="r-label">正答率 / Accuracy</div>
        </div>
        <div class="r-stat">
          <span class="r-val" id="rStreak" style="color:var(--yellow)">0</span>
          <div class="r-label">最大連続 / Best Streak</div>
        </div>
      </div>

      <div id="missedBlock" style="display:none">
        <div class="missed-block">
          <div class="missed-title">❌ 要復習 / Review these</div>
          <div id="missedList"></div>
        </div>
      </div>

      <button class="btn-primary" id="retryBtn" onclick="retrySession()">🔄 もう一度 / Retry</button>
      <button class="btn-secondary" onclick="goSetup()">⚙️ 設定に戻る / Back to setup</button>
    </div>
  </div>

</div>

<script>
// ===== VOCABULARY =====
const VOCAB_L1 = [
  { jp: '…の前に（の）',          en: 'before' },
  { jp: '写真撮影',                en: 'photography' },
  { jp: 'そのとおり。',            en: "That's right." },
  { jp: '記事',                    en: 'article' },
  { jp: '勝ち抜き戦、トーナメント', en: 'tournament' },
  { jp: '混雑した',                en: 'crowded' },
  { jp: '合唱',                    en: 'chorus' },
  { jp: '代わりに',                en: 'instead' },
  { jp: '早い',                    en: 'early' },
  { jp: '分',                      en: 'minute' },
  { jp: '選択',                    en: 'choice' },
  { jp: 'キャンセル、中止する',    en: 'cancel' },
  { jp: '…に対抗して',            en: 'against' },
  { jp: '最後の',                  en: 'final' },
  { jp: '（時間の）秒',            en: 'second' },
  { jp: '確かに、きっと',          en: 'surely' },
  { jp: '競技会',                  en: 'competition' },
  { jp: '詩',                      en: 'poem' },
  { jp: '広げる',                  en: 'spread' },
  { jp: '…まで（ずっと）',        en: 'until' },
  { jp: '半分の',                  en: 'half' },
  { jp: '1時間',                   en: 'hour' },
  { jp: '負ける',                  en: 'lose' },
  { jp: 'こわす',                  en: 'break' },
];
const VOCAB_L2 = [
  { jp: '冒険',                    en: 'adventure' },
  { jp: 'おもな',                  en: 'main' },
  { jp: 'いたずらな、わんぱくな',  en: 'naughty' },
  { jp: 'やっかいな事態、困難',    en: 'trouble' },
  { jp: '貸す',                    en: 'lend' },
  { jp: '同意する',                en: 'agree' },
  { jp: '実験',                    en: 'experiment' },
  { jp: '空っぽ',                  en: 'empty' },
  { jp: 'もう1つの、別の',         en: 'another' },
  { jp: 'シリーズ',                en: 'series' },
  { jp: '作者',                    en: 'author' },
  { jp: '景色',                    en: 'scenery' },
  { jp: '自然',                    en: 'nature' },
  { jp: '実は',                    en: 'in fact' },
  { jp: '地方',                    en: 'district' },
  { jp: '地域',                    en: 'area' },
  { jp: 'まだ、今でも',            en: 'still' },
  { jp: 'いつか',                  en: 'someday' },
  { jp: '変な',                    en: 'strange' },
  { jp: '風景',                    en: 'landscape' },
  { jp: '意見',                    en: 'opinion' },
  { jp: '遠い',                    en: 'faraway' },
  { jp: '訓練',                    en: 'training' },
  { jp: 'おとな',                  en: 'grown-up' },
  { jp: '学習者',                  en: 'learner' },
  { jp: '魔女',                    en: 'witch' },
  { jp: 'さらにその上',            en: 'plus' },
  { jp: '…の間で',                en: 'among' },
  { jp: '10代の少年',              en: 'teenager' },
  { jp: '結末',                    en: 'ending' },
  { jp: '心温まる',                en: 'heartwarming' },
  { jp: '推薦する、すすめる',      en: 'recommend' },
];
const VOCAB_ALL = [...VOCAB_L1, ...VOCAB_L2];

// ===== STATE =====
let cfg = { mode: 'flash', count: 10, lesson: 'L1' };
let session = {};

// ===== THEME =====
function toggleTheme() {
  const html = document.documentElement;
  const isDark = html.getAttribute('data-theme') === 'dark';
  html.setAttribute('data-theme', isDark ? 'light' : 'dark');
  document.getElementById('themeBtn').textContent = isDark ? '🌙 Dark' : '☀️ Light';
}

// ===== HELPERS =====
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0, 0);
}
function flash(type) {
  const el = document.getElementById('dmgFlash');
  el.className = `damage-flash ${type} show`;
  setTimeout(() => el.classList.remove('show'), 200);
}

// ===== SETUP =====
function selectLesson(l) {
  cfg.lesson = l;
  ['L1','L2','ALL'].forEach(x => {
    const el = document.getElementById('lesson' + x);
    if (el) el.classList.toggle('selected', x === l);
  });
}
function selectMode(m) {
  cfg.mode = m;
  document.getElementById('modeFlash').classList.toggle('selected', m === 'flash');
  document.getElementById('modeType').classList.toggle('selected', m === 'type');
}
function selectCount(n) {
  cfg.count = n;
  document.querySelectorAll('.count-btn').forEach(b => b.classList.remove('selected'));
  event.target.closest('.count-btn').classList.add('selected');
}
function goSetup() { showScreen('setupScreen'); }

function startSession() {
  const vocabMap = { L1: VOCAB_L1, L2: VOCAB_L2, ALL: VOCAB_ALL };
  const pool = shuffle(vocabMap[cfg.lesson] || VOCAB_L1);
  const words = cfg.count >= 99 ? pool : pool.slice(0, Math.min(cfg.count, pool.length));
  session = {
    words, index: 0,
    correct: 0, wrong: 0, streak: 0, bestStreak: 0, missed: [],
    knowCount: 0, againCount: 0, againQueue: [], flipped: false, answered: false,
  };
  if (cfg.mode === 'flash') startFlash();
  else startType();
}

// ===== FLASH CARD =====
function startFlash() {
  showScreen('flashScreen');
  session.queue = [...session.words];
  renderFlashCard();
}
function renderFlashCard() {
  const q = session.queue[0];
  if (!q) { showResult(); return; }
  session.flipped = false;
  document.getElementById('cardInner').classList.remove('flipped');
  document.getElementById('cardJP').textContent = q.jp;
  document.getElementById('cardEN').textContent = q.en;
  const pct = Math.round(session.knowCount / session.words.length * 100);
  document.getElementById('flashProgFill').style.width = pct + '%';
  document.getElementById('flashProgLabel').textContent = `${session.knowCount} / ${session.words.length}`;
  document.getElementById('flashKnow').textContent = `✓ ${session.knowCount}`;
  document.getElementById('flashAgain').textContent = `✗ ${session.againCount}`;
  document.getElementById('flashRemain').textContent = `⟳ ${session.queue.length}`;
  document.getElementById('btnKnow').disabled = true;
  document.getElementById('btnAgain').disabled = true;
}
function flipCard() {
  if (session.flipped) return;
  session.flipped = true;
  document.getElementById('cardInner').classList.add('flipped');
  document.getElementById('btnKnow').disabled = false;
  document.getElementById('btnAgain').disabled = false;
}
function markCard(knew) {
  if (!session.flipped) return;
  const card = session.queue.shift();
  if (knew) { session.knowCount++; flash('cor-flash'); }
  else { session.againCount++; session.queue.push(card); flash('wrn-flash'); }
  if (session.queue.length === 0) {
    session.correct = session.knowCount;
    session.wrong = session.againCount;
    showResult();
  } else { renderFlashCard(); }
}

// ===== TYPING =====
function startType() {
  showScreen('typeScreen');
  session.index = 0;
  session.answered = false;
  renderTypeCard();
}
function renderTypeCard() {
  const q = session.words[session.index];
  if (!q) { showResult(); return; }
  session.answered = false;
  document.getElementById('typeWord').textContent = q.jp;
  document.getElementById('typeNum').textContent = `${session.index + 1} / ${session.words.length}`;
  const pct = Math.round(session.index / session.words.length * 100);
  document.getElementById('typeProgFill').style.width = pct + '%';
  document.getElementById('typeProgLabel').textContent = `${session.index + 1} / ${session.words.length}`;
  document.getElementById('typeScore').textContent = `✓ ${session.correct}`;
  document.getElementById('typeWrong').textContent = `✗ ${session.wrong}`;
  document.getElementById('typeStreak').textContent = `🔥 ${session.streak}`;
  const input = document.getElementById('typeInput');
  input.value = '';
  input.className = 'type-input';
  input.disabled = false;
  input.focus();
  document.getElementById('submitBtn').disabled = false;
  document.getElementById('typeFeedback').className = 'feedback-box';
  document.getElementById('typeFeedback').textContent = '';
  document.getElementById('typeNextBtn').className = 'next-btn';
}
function handleTypeKey(e) {
  if (e.key === 'Enter') {
    if (!session.answered) submitType();
    else typeNext();
  }
}
function submitType() {
  if (session.answered) return;
  const q = session.words[session.index];
  const input = document.getElementById('typeInput');
  const given = input.value.trim();
  if (!given) return;
  session.answered = true;
  input.disabled = true;
  document.getElementById('submitBtn').disabled = true;
  document.getElementById('typeNextBtn').className = 'next-btn visible';
  const isOk = given.toLowerCase() === q.en.toLowerCase();
  const fb = document.getElementById('typeFeedback');
  if (isOk) {
    input.classList.add('correct');
    fb.className = 'feedback-box ok';
    fb.textContent = `✓ Correct! "${q.en}"`;
    session.correct++;
    session.streak++;
    session.bestStreak = Math.max(session.bestStreak, session.streak);
    flash('cor-flash');
  } else {
    input.classList.add('wrong');
    fb.className = 'feedback-box ng';
    fb.textContent = `✗ The answer is "${q.en}"`;
    session.wrong++;
    session.streak = 0;
    session.missed.push({ jp: q.jp, en: q.en });
    flash('wrn-flash');
  }
  document.getElementById('typeScore').textContent = `✓ ${session.correct}`;
  document.getElementById('typeWrong').textContent = `✗ ${session.wrong}`;
  document.getElementById('typeStreak').textContent = `🔥 ${session.streak}`;
}
function typeNext() {
  session.index++;
  if (session.index >= session.words.length) showResult();
  else renderTypeCard();
}

// ===== RESULT =====
function showResult() {
  const total = session.words.length;
  const correct = session.correct;
  const wrong = cfg.mode === 'flash' ? session.againCount : session.wrong;
  const pct = Math.round(correct / total * 100);
  let emoji, title;
  if (pct === 100)    { emoji = '🌟'; title = '満点！Perfect!'; }
  else if (pct >= 80) { emoji = '🏆'; title = 'すごい！Great!'; }
  else if (pct >= 60) { emoji = '📖'; title = 'よくやった！Good!'; }
  else                { emoji = '💪'; title = '要復習！Keep studying!'; }
  document.getElementById('resultEmoji').textContent = emoji;
  document.getElementById('resultTitle').textContent = title;
  const lessonNames = { L1: 'Lesson 1', L2: 'Lesson 2', ALL: 'L1 & L2' };
  document.getElementById('resultSub').textContent =
    `${cfg.mode === 'flash' ? 'Flash Cards' : 'Typing'} · ${lessonNames[cfg.lesson]} · ${total} words`;
  document.getElementById('rCorrect').textContent = correct;
  document.getElementById('rWrong').textContent = wrong;
  document.getElementById('rPct').textContent = pct + '%';
  document.getElementById('rStreak').textContent = session.bestStreak || '—';
  if (session.missed.length > 0 && cfg.mode === 'type') {
    document.getElementById('missedBlock').style.display = 'block';
    document.getElementById('missedList').innerHTML = session.missed.map(m =>
      `<div class="missed-row"><span class="missed-jp">${m.jp}</span><span class="missed-en">${m.en}</span></div>`
    ).join('');
  } else {
    document.getElementById('missedBlock').style.display = 'none';
  }
  showScreen('resultScreen');
}
function retrySession() { startSession(); }
</script>
</body>
</html>
