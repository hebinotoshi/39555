<!DOCTYPE html>
<html lang="ja" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>英検3級 — Writing Practice</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;700;800&display=swap');

  :root[data-theme="dark"] {
    --bg:#111318; --surface:#1c1f27; --surface2:#252932;
    --border:#333848; --border2:#444c60;
    --text:#eef0f6; --text-dim:#8890a8; --text-faint:#4a5068;
    --accent:#6c8ef5; --accent-bg:rgba(108,142,245,0.12);
    --green:#3ecf8e; --green-bg:rgba(62,207,142,0.12);
    --red:#f56565; --red-bg:rgba(245,101,101,0.12);
    --yellow:#f0c060; --yellow-bg:rgba(240,192,96,0.1);
    --purple:#b07ef5; --purple-bg:rgba(176,126,245,0.12);
    --orange:#f5a040; --orange-bg:rgba(245,160,64,0.12);
    --shadow:0 2px 12px rgba(0,0,0,0.4); --shadow-lg:0 8px 32px rgba(0,0,0,0.5);
    --toggle-bg:#252932;
  }
  :root[data-theme="light"] {
    --bg:#f4f6fb; --surface:#ffffff; --surface2:#f0f3fa;
    --border:#dde2ef; --border2:#c8d0e4;
    --text:#1a1d2e; --text-dim:#5a6280; --text-faint:#a0a8c0;
    --accent:#4a72e8; --accent-bg:rgba(74,114,232,0.1);
    --green:#1fad72; --green-bg:rgba(31,173,114,0.1);
    --red:#e03e3e; --red-bg:rgba(224,62,62,0.1);
    --yellow:#c08020; --yellow-bg:rgba(192,128,32,0.1);
    --purple:#7040d0; --purple-bg:rgba(112,64,208,0.1);
    --orange:#c06010; --orange-bg:rgba(192,96,16,0.1);
    --shadow:0 2px 12px rgba(0,0,0,0.08); --shadow-lg:0 8px 32px rgba(0,0,0,0.12);
    --toggle-bg:#e8ecf5;
  }

  * { box-sizing:border-box; margin:0; padding:0; }
  body {
    background:var(--bg); color:var(--text);
    font-family:'Noto Sans JP','Inter',sans-serif;
    min-height:100vh; transition:background 0.25s,color 0.25s;
    padding-bottom:60px;
  }

  .container { width:100%; max-width:700px; padding:0 20px; margin:0 auto; }

  /* TOP BAR */
  .top-bar { display:flex; align-items:center; justify-content:space-between; padding:16px 0 0; margin-bottom:4px; }
  .back-link { font-size:15px; font-weight:600; color:var(--text-dim); text-decoration:none; transition:color 0.15s; }
  .back-link:hover { color:var(--accent); }
  .theme-toggle { background:var(--toggle-bg); border:1.5px solid var(--border); border-radius:99px; padding:7px 16px; font-size:14px; cursor:pointer; color:var(--text-dim); font-family:inherit; font-weight:500; transition:all 0.15s; }
  .theme-toggle:hover { border-color:var(--accent); color:var(--text); }

  /* TITLE */
  .title-block { text-align:center; padding:20px 0 26px; }
  .title-icon { font-size:40px; display:block; margin-bottom:10px; }
  .title-main { font-size:clamp(20px,5vw,26px); font-weight:800; color:var(--text); }
  .title-sub { font-size:14px; color:var(--text-dim); margin-top:6px; font-weight:500; }

  /* SCREEN */
  .screen { display:none; }
  .screen.active { display:block; }

  /* TYPE TABS — menu cards */
  .type-tabs { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:20px; }
  .ttab {
    background:var(--surface); border:2px solid var(--border);
    border-radius:16px; padding:20px 14px; cursor:pointer;
    font-family:inherit; font-weight:700; font-size:15px;
    text-align:center; transition:all 0.15s; line-height:1.5;
    box-shadow:var(--shadow);
  }
  .ttab .tab-icon { font-size:28px; display:block; margin-bottom:8px; }
  .ttab .tab-label { display:block; font-size:15px; }
  .ttab .tab-sub { display:block; font-size:12px; color:var(--text-dim); margin-top:4px; font-weight:500; }
  .ttab:hover { transform:translateY(-2px); box-shadow:var(--shadow-lg); }
  .ttab.A { border-color:var(--green); }
  .ttab.A:hover { background:var(--green-bg); }
  .ttab.B { border-color:var(--yellow); }
  .ttab.B:hover { background:var(--yellow-bg); }
  .ttab.C { border-color:var(--purple); }
  .ttab.C:hover { background:var(--purple-bg); }
  .ttab.D { border-color:var(--orange); }
  .ttab.D:hover { background:var(--orange-bg); }

  /* MENU INFO BOX */
  .menu-info { background:var(--surface); border:1.5px solid var(--border); border-radius:16px; padding:18px 20px; font-size:15px; color:var(--text-dim); line-height:1.9; box-shadow:var(--shadow); }

  /* PROGRESS */
  .prog-row { display:flex; align-items:center; gap:14px; margin-bottom:14px; }
  .prog-bar { flex:1; height:6px; background:var(--surface2); border-radius:99px; overflow:hidden; }
  .prog-fill { height:100%; border-radius:99px; transition:width 0.4s; }
  .prog-fill.A { background:var(--green); }
  .prog-fill.B { background:var(--yellow); }
  .prog-fill.C { background:var(--purple); }
  .prog-fill.D { background:var(--orange); }
  .prog-label { font-size:14px; font-weight:600; color:var(--text-dim); white-space:nowrap; }

  .score-row { display:flex; gap:10px; margin-bottom:18px; }
  .score-pill { flex:1; text-align:center; font-size:14px; font-weight:700; padding:8px 10px; border-radius:10px; border:1.5px solid var(--border); background:var(--surface); }
  .score-pill.cor { color:var(--green); border-color:var(--green); background:var(--green-bg); }
  .score-pill.wrn { color:var(--red); border-color:var(--red); background:var(--red-bg); }

  /* QUESTION BLOCKS */
  .qblock { background:var(--surface); border:1.5px solid var(--border); border-radius:16px; padding:20px 18px; margin-bottom:16px; box-shadow:var(--shadow); }
  .qnum { font-size:12px; font-weight:700; color:var(--text-faint); text-transform:uppercase; letter-spacing:0.08em; margin-bottom:10px; }
  .qtype-badge { display:inline-block; font-size:11px; font-weight:700; padding:4px 12px; border-radius:99px; margin-bottom:12px; }
  .qtype-badge.A { background:var(--green-bg); color:var(--green); border:1px solid var(--green); }
  .qtype-badge.B { background:var(--yellow-bg); color:var(--yellow); border:1px solid var(--yellow); }
  .qtype-badge.C { background:var(--purple-bg); color:var(--purple); border:1px solid var(--purple); }
  .qtype-badge.D { background:var(--orange-bg); color:var(--orange); border:1px solid var(--orange); }

  .qinstruction { font-size:14px; color:var(--text-dim); margin-bottom:12px; line-height:1.6; }
  .qtext { font-size:17px; font-weight:700; color:var(--text); line-height:1.8; margin-bottom:14px; }

  /* WORD CHIPS (Type A) */
  .chip-area-label { font-size:11px; font-weight:700; color:var(--text-faint); text-transform:uppercase; letter-spacing:0.08em; margin-bottom:8px; }
  .word-chips { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:8px; min-height:48px; }
  .chip {
    background:var(--surface2); border:2px solid var(--green);
    border-radius:10px; padding:8px 14px; font-size:15px; font-weight:700;
    color:var(--green); font-family:inherit; cursor:pointer; transition:all 0.12s; user-select:none;
  }
  .chip:hover { background:var(--green-bg); transform:translateY(-2px); box-shadow:0 4px 12px rgba(62,207,142,0.2); }
  .chip.used { opacity:0.2; cursor:default; pointer-events:none; transform:none; box-shadow:none; }

  .answer-slots {
    display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px;
    min-height:52px; padding:10px; background:var(--surface2);
    border:2px dashed var(--border); border-radius:12px;
  }
  .answer-slots.has-words { border-color:var(--green); border-style:solid; }
  .slot-chip {
    background:var(--green-bg); border:2px solid var(--green); border-radius:10px;
    padding:8px 14px; font-size:15px; font-weight:700; color:var(--green);
    font-family:inherit; cursor:pointer; transition:all 0.12s; user-select:none;
  }
  .slot-chip:hover { background:var(--red-bg); border-color:var(--red); color:var(--red); }
  .slot-placeholder { font-size:13px; color:var(--text-faint); align-self:center; }

  /* INPUTS */
  .ans-row { display:flex; gap:10px; margin-bottom:12px; }
  .ans-input {
    flex:1; background:var(--surface2); border:2px solid var(--border);
    color:var(--text); padding:13px 16px; border-radius:12px;
    font-family:inherit; font-size:17px; font-weight:700;
    outline:none; transition:border-color 0.15s;
  }
  .ans-input:focus { border-color:var(--accent); }
  .ans-input.correct { border-color:var(--green); background:var(--green-bg); color:var(--green); }
  .ans-input.wrong { border-color:var(--red); background:var(--red-bg); }
  .ans-input:disabled { opacity:0.85; cursor:default; }

  .ans-textarea {
    width:100%; background:var(--surface2); border:2px solid var(--border);
    color:var(--text); padding:14px 16px; border-radius:12px;
    font-family:inherit; font-size:17px; font-weight:600;
    outline:none; resize:vertical; min-height:100px; line-height:1.6;
    transition:border-color 0.15s; margin-bottom:12px;
  }
  .ans-textarea:focus { border-color:var(--purple); }
  .ans-textarea:disabled { opacity:0.85; cursor:default; }

  /* CHECK BUTTONS */
  .check-btn {
    background:var(--green); color:#fff; border:none;
    padding:13px 18px; font-family:inherit; font-size:15px; font-weight:700;
    cursor:pointer; border-radius:12px; transition:all 0.12s; white-space:nowrap;
  }
  .check-btn:hover:not(:disabled) { filter:brightness(1.1); transform:translateY(-1px); }
  .check-btn:disabled { opacity:0.4; cursor:default; transform:none; }
  .check-btn.B { background:var(--yellow); color:#000; }
  .check-btn.C { background:var(--purple); color:#fff; }
  .check-btn.D { background:var(--orange); color:#fff; }

  /* FEEDBACK */
  .feedback { font-size:15px; font-weight:600; padding:14px 18px; border-radius:12px; display:none; line-height:1.5; margin-top:10px; }
  .feedback.ok { display:block; background:var(--green-bg); color:var(--green); border:1.5px solid var(--green); }
  .feedback.ng { display:block; background:var(--red-bg); color:var(--red); border:1.5px solid var(--red); }
  .feedback.info { display:block; background:var(--purple-bg); color:var(--purple); border:1.5px solid var(--purple); }

  /* HINTS / MODEL ANSWERS */
  .model-btn { background:transparent; border:1.5px solid var(--border); color:var(--text-dim); padding:7px 14px; border-radius:99px; font-size:13px; cursor:pointer; font-family:inherit; font-weight:500; transition:all 0.12s; margin-top:10px; }
  .model-btn:hover { border-color:var(--accent); color:var(--accent); }
  .model-answer { font-size:14px; color:var(--text-dim); margin-top:10px; padding:14px 16px; background:var(--surface2); border:1.5px solid var(--border); border-radius:12px; display:none; line-height:1.8; }
  .model-answer.visible { display:block; }

  /* JP TRANSLATION (Type B) */
  .jp-translate { font-size:15px; color:var(--yellow); margin-top:10px; padding:12px 16px; background:var(--yellow-bg); border:1.5px solid var(--yellow); border-radius:12px; display:none; line-height:1.7; }
  .jp-translate.visible { display:block; }

  /* NEXT BUTTON */
  .next-btn { display:none; width:100%; background:var(--surface2); color:var(--text); border:2px solid var(--border); padding:16px; font-family:inherit; font-size:16px; font-weight:700; cursor:pointer; border-radius:12px; transition:all 0.12s; margin-bottom:10px; }
  .next-btn.visible { display:block; }
  .next-btn:hover { border-color:var(--accent); color:var(--accent); }

  /* RESULT */
  .result-wrap { text-align:center; padding:28px 0; }
  .result-emoji { font-size:80px; display:block; margin-bottom:14px; animation:rb 0.5s; }
  @keyframes rb { 0%{transform:scale(0)} 60%{transform:scale(1.15)} 100%{transform:scale(1)} }
  .result-title { font-size:24px; font-weight:800; margin-bottom:8px; }
  .result-sub { font-size:15px; color:var(--text-dim); margin-bottom:24px; }
  .result-stats { display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; margin:18px 0; }
  .r-stat { background:var(--surface); border:1.5px solid var(--border); border-radius:14px; padding:16px 12px; text-align:center; box-shadow:var(--shadow); }
  .r-val { font-size:26px; font-weight:800; display:block; margin-bottom:5px; }
  .r-label { font-size:12px; color:var(--text-dim); font-weight:500; }

  /* BUTTONS */
  .btn-primary { display:block; width:100%; border:none; padding:18px 20px; font-family:inherit; font-size:17px; font-weight:700; cursor:pointer; border-radius:12px; margin-bottom:12px; transition:all 0.15s; }
  .btn-primary.A { background:var(--green); color:#fff; box-shadow:0 4px 16px rgba(62,207,142,0.25); }
  .btn-primary.B { background:var(--yellow); color:#000; box-shadow:0 4px 16px rgba(240,192,96,0.25); }
  .btn-primary.C { background:var(--purple); color:#fff; box-shadow:0 4px 16px rgba(176,126,245,0.25); }
  .btn-primary.D { background:var(--orange); color:#fff; box-shadow:0 4px 16px rgba(245,160,64,0.25); }
  .btn-primary:hover { filter:brightness(1.1); transform:translateY(-1px); }
  .btn-secondary { display:block; width:100%; background:transparent; color:var(--text-dim); border:2px solid var(--border); padding:16px 20px; font-family:inherit; font-size:15px; font-weight:600; cursor:pointer; border-radius:12px; margin-bottom:10px; transition:all 0.15s; }
  .btn-secondary:hover { border-color:var(--text-dim); color:var(--text); }
  .back-sep { margin-top:32px; padding-top:24px; border-top:1.5px solid var(--border); }

  .finish-btn { display:none; width:100%; border:none; padding:18px 20px; font-family:inherit; font-size:16px; font-weight:700; cursor:pointer; border-radius:12px; margin-bottom:12px; transition:all 0.15s; }
  .finish-btn.visible { display:block; }
</style>
</head>
<body>
<div class="container">
  <div class="top-bar">
    <a class="back-link" href="index.html">← Back</a>
    <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">🌙 Dark</button>
  </div>

  <div class="title-block">
    <span class="title-icon">✏️</span>
    <div class="title-main">ライティング練習</div>
    <div class="title-sub">Eiken Grade 3 — Writing Practice</div>
  </div>

  <!-- MENU -->
  <div class="screen active" id="menuScreen">
    <div class="type-tabs">
      <button class="ttab A" onclick="startType('A')">
        <span class="tab-icon">🔀</span>
        <span class="tab-label">並び替え</span>
        <span class="tab-sub">Type A · 20問</span>
      </button>
      <button class="ttab B" onclick="startType('B')">
        <span class="tab-icon">📝</span>
        <span class="tab-label">空欄補充</span>
        <span class="tab-sub">Type B · 20問</span>
      </button>
      <button class="ttab C" onclick="startType('C')">
        <span class="tab-icon">💬</span>
        <span class="tab-label">英作文</span>
        <span class="tab-sub">Type C · 20問</span>
      </button>
      <button class="ttab D" onclick="startType('D')">
        <span class="tab-icon">🔧</span>
        <span class="tab-label">語形変化</span>
        <span class="tab-sub">Type D · 20問</span>
      </button>
    </div>
    <div class="menu-info">
      📌 英検3級レベルのライティング練習です。<br>
      Type A: 単語をタップして正しい順に並べる<br>
      Type B: 空欄に適切な語を入れる（日本語訳あり）<br>
      Type C: 質問に英語で自由に答える<br>
      Type D: 動詞などを正しい形に変える
    </div>
  </div>

  <!-- QUIZ SCREEN -->
  <div class="screen" id="quizScreen">
    <div class="score-row">
      <div class="score-pill cor" id="scoreCorrect">✓ 0</div>
      <div class="score-pill wrn" id="scoreWrong">✗ 0</div>
    </div>
    <div class="prog-row">
      <div class="prog-bar"><div class="prog-fill" id="progFill" style="width:0%"></div></div>
      <div class="prog-label" id="progLabel">0 / 20</div>
    </div>
    <div id="questionsArea"></div>
    <button class="finish-btn" id="finishBtn" onclick="showResult()">📊 結果を見る</button>
    <div class="back-sep">
      <button class="btn-secondary" onclick="goMenu()">← タイプ選択へ戻る</button>
    </div>
  </div>

  <!-- RESULT -->
  <div class="screen" id="resultScreen">
    <div class="result-wrap">
      <span class="result-emoji" id="resultEmoji">🏆</span>
      <div class="result-title" id="resultTitle">—</div>
      <div class="result-sub" id="resultSub">—</div>
      <div class="result-stats">
        <div class="r-stat"><span class="r-val" id="rCorrect" style="color:var(--green)">0</span><div class="r-label">正解</div></div>
        <div class="r-stat"><span class="r-val" id="rWrong" style="color:var(--red)">0</span><div class="r-label">不正解</div></div>
        <div class="r-stat"><span class="r-val" id="rPct" style="color:var(--accent)">0%</span><div class="r-label">正答率</div></div>
      </div>
      <button class="btn-primary" id="retryBtn" onclick="retryType()">🔄 もう一度！</button>
      <div class="back-sep">
        <button class="btn-secondary" onclick="goMenu()">← タイプ選択へ</button>
      </div>
    </div>
  </div>
</div>

<script>
function toggleTheme() {
  const html = document.documentElement;
  const isDark = html.getAttribute('data-theme') === 'dark';
  html.setAttribute('data-theme', isDark ? 'light' : 'dark');
  document.getElementById('themeBtn').textContent = isDark ? '🌙 Dark' : '☀️ Light';
}

// ═══════════════════════════════════════════
// TYPE A — 並び替え (Word Order)
// ═══════════════════════════════════════════
const TYPE_A = [
  { words: ['she', 'every', 'goes', 'morning', 'to', 'school'], answer: 'She goes to school every morning.', hint: '主語→動詞→場所→時間の順' },
  { words: ['did', 'What', 'last', 'you', 'Sunday', 'do', '?'], answer: 'What did you do last Sunday?', hint: '疑問詞→助動詞→主語→動詞' },
  { words: ['my', 'like', 'I', 'very', 'much', 'cat'], answer: 'I like my cat very much.', hint: '主語→動詞→目的語→副詞' },
  { words: ['is', 'she', 'now', 'English', 'studying'], answer: 'She is studying English now.', hint: '現在進行形：be動詞＋〜ing' },
  { words: ['yesterday', 'I', 'to', 'went', 'the', 'library'], answer: 'I went to the library yesterday.', hint: '主語→動詞（過去形）→場所→時間' },
  { words: ['a', 'There', 'near', 'is', 'station', 'park', 'the'], answer: 'There is a park near the station.', hint: 'There is〜の文' },
  { words: ['you', 'help', 'Can', 'me', '?'], answer: 'Can you help me?', hint: '助動詞→主語→動詞→目的語' },
  { words: ['his', 'dog', 'Tom', 'plays', 'with', 'every', 'day'], answer: 'Tom plays with his dog every day.', hint: '主語→動詞→前置詞句→時間' },
  { words: ['does', 'What', 'your', 'do', 'father', '?'], answer: 'What does your father do?', hint: '職業を聞く表現' },
  { words: ['been', 'I', 'have', 'to', 'never', 'Okinawa'], answer: 'I have never been to Okinawa.', hint: '現在完了形＋never' },
  { words: ['flowers', 'she', 'beautiful', 'gave', 'me', 'some'], answer: 'She gave me some beautiful flowers.', hint: '第4文型：動詞→人→物' },
  { words: ['taller', 'Ken', 'than', 'is', 'Mike'], answer: 'Ken is taller than Mike.', hint: '比較級＋than' },
  { words: ['in', 'the', 'summer', 'swimming', 'I', 'enjoy'], answer: 'I enjoy swimming in the summer.', hint: 'enjoy＋動名詞（〜ing）' },
  { words: ['any', 'Do', 'brothers', 'have', 'you', '?'], answer: 'Do you have any brothers?', hint: '疑問文でsome→any' },
  { words: ['to', 'I', 'be', 'want', 'a', 'doctor'], answer: 'I want to be a doctor.', hint: 'want to＋動詞の原形' },
  { words: ['was', 'it', 'yesterday', 'cold', 'very'], answer: 'It was very cold yesterday.', hint: '天気・気温の表現' },
  { words: ['he', 'When', 'did', 'arrive', '?'], answer: 'When did he arrive?', hint: '疑問詞when＋did' },
  { words: ['happy', 'makes', 'music', 'me'], answer: 'Music makes me happy.', hint: '第5文型：make＋目的語＋形容詞' },
  { words: ['for', 'she', 'has', 'years', 'three', 'piano', 'the', 'played'], answer: 'She has played the piano for three years.', hint: '現在完了形＋for' },
  { words: ['is', 'Who', 'girl', 'that', '?'], answer: 'Who is that girl?', hint: '疑問詞who＋be動詞' },
];

// ═══════════════════════════════════════════
// TYPE B — 空欄補充 (Fill in the blank)
// ═══════════════════════════════════════════
const TYPE_B = [
  { sentence: 'I am good ___ playing tennis.', jp: '私はテニスをするのが得意です。', answer: 'at', hint: 'good at〜：〜が得意' },
  { sentence: 'She has lived here ___ five years.', jp: '彼女はここに5年間住んでいます。', answer: 'for', hint: '期間にはfor、起点にはsince' },
  { sentence: 'He is interested ___ science.', jp: '彼は科学に興味があります。', answer: 'in', hint: 'interested in〜：〜に興味がある' },

// ═══════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════
let currentType = 'A';
let state = { correct: 0, wrong: 0, answers: {}, finished: false };

const TYPE_DATA = { A: TYPE_A, B: TYPE_B, C: TYPE_C, D: TYPE_D };
const TYPE_COLOR = { A: 'var(--accent)', B: 'var(--accent3)', C: 'var(--accent4)', D: 'var(--accent5)' };
const TYPE_LABELS = {
  A: '並び替え',
  B: '空欄補充',
  C: '英作文',
  D: '語形変化',
};

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0, 0);
}

function goMenu() { showScreen('menuScreen'); }

function startType(type) {
  currentType = type;
  state = { correct: 0, wrong: 0, answers: {}, finished: false };
  document.getElementById('progFill').className = `prog-fill ${type}`;

  const finBtn = document.getElementById('finishBtn');
  finBtn.className = 'finish-btn';
  finBtn.style.cssText = '';
  finBtn.classList.remove('visible');
  if (type === 'A') { finBtn.style.background = 'var(--accent)'; finBtn.style.color = '#000'; }
  else if (type === 'B') { finBtn.style.background = 'var(--accent3)'; finBtn.style.color = '#000'; }
  else if (type === 'C') { finBtn.style.background = 'var(--accent4)'; finBtn.style.color = '#fff'; }
  else { finBtn.style.background = 'var(--accent5)'; finBtn.style.color = '#000'; }

  showScreen('quizScreen');
  renderQuestions();
}

function renderQuestions() {
  const qs = TYPE_DATA[currentType];
  const area = document.getElementById('questionsArea');
  let html = '';

  qs.forEach((q, i) => {
    if (currentType === 'A') {
      const shuffled = [...q.words].sort(() => Math.random() - 0.5);
      window._chipData = window._chipData || {};
      window._chipData[i] = { shuffled, selected: [] };
      const chipHtml = shuffled.map((w,wi) => `<span class="chip" id="chip${i}_${wi}" onclick="selectChip(${i},${wi})">${w}</span>`).join('');
      html += `
        <div class="qblock" id="qblock${i}">
          <div class="qnum">問 ${i+1} / ${qs.length}</div>
          <div class="qtype-badge A">Type A — 並び替え</div>
          <div class="qinstruction">単語をタップして正しい順に並べなさい。並べた単語をタップすると戻せます。</div>
          <div class="chip-area-label">WORD POOL</div>
          <div class="word-chips" id="pool${i}">${chipHtml}</div>
          <div class="chip-area-label" style="margin-top:10px">YOUR ANSWER</div>
          <div class="answer-slots" id="slots${i}"><span class="slot-placeholder">ここに単語が並びます</span></div>
          <div style="display:flex;gap:8px;margin-bottom:10px">
            <button class="check-btn A" id="btn${i}" onclick="checkA(${i})">✓ 確認</button>
            <button class="check-btn" style="background:var(--panel2);color:var(--text-dim);box-shadow:none;border:1.5px solid var(--border)" onclick="clearSlots(${i})">✕ クリア</button>
          </div>
          <div class="feedback" id="fb${i}"></div>
          <button class="model-btn" id="hintbtn${i}" onclick="showHintA(${i})">💡 ヒント</button>
          <div class="model-answer" id="hint${i}"></div>
        </div>`;
    } else if (currentType === 'B') {
      html += `
        <div class="qblock" id="qblock${i}">
          <div class="qnum">問 ${i+1} / ${qs.length}</div>
          <div class="qtype-badge B">Type B — 空欄補充</div>
          <div class="qinstruction">空欄に入る最も適切な語を書きなさい。</div>
          <div class="qtext">${q.sentence}</div>
          <div style="margin-bottom:12px">
            <button class="model-btn" onclick="toggleJp(${i})" id="jpbtn${i}">🇯🇵 日本語訳を見る（任意）</button>
            <div class="model-answer" id="jp${i}" class="jp-translate">${q.jp}</div>
          </div>
          <div class="ans-row">
            <input class="ans-input" id="input${i}" type="text" placeholder="答えを入力…" autocomplete="off" autocorrect="off" spellcheck="false" onkeydown="handleKey(event,${i},'B')">
            <button class="check-btn B" id="btn${i}" onclick="checkB(${i})">確認</button>
          </div>
          <div class="feedback" id="fb${i}"></div>
          <button class="model-btn" id="hintbtn${i}" onclick="showHintById(${i})">💡 ヒント</button>
          <div class="model-answer" id="hint${i}"></div>
        </div>`;
    } else if (currentType === 'C') {
      html += `
        <div class="qblock" id="qblock${i}">
          <div class="qnum">問 ${i+1} / ${qs.length}</div>
          <div class="qtype-badge C">Type C — 英作文</div>
          <div class="qinstruction">次の質問に1〜3文の英語で答えなさい。</div>
          <div class="qtext">${q.question}</div>
          <textarea class="ans-textarea" id="input${i}" placeholder="英語で答えを書いてください…" ${state.answers[i] ? 'disabled' : ''}></textarea>
          <button class="check-btn C" id="btn${i}" onclick="checkC(${i})" ${state.answers[i] ? 'disabled' : ''}>提出する</button>
          <div class="feedback" id="fb${i}"></div>
          <button class="model-btn" id="modelbtn${i}" onclick="showModel(${i})" style="display:none">📖 模範解答を見る</button>
          <div class="model-answer" id="model${i}">
            <strong>模範解答:</strong><br>${q.model}<br><br>
            <strong>チェックポイント:</strong><br>${q.points.map(p=>`・${p}`).join('<br>')}
          </div>
        </div>`;
    } else if (currentType === 'D') {
      html += `
        <div class="qblock" id="qblock${i}">
          <div class="qnum">問 ${i+1} / ${qs.length}</div>
          <div class="qtype-badge D">Type D — 語形変化</div>
          <div class="qinstruction">（　）内の語を適切な形に変えなさい。</div>
          <div class="qtext">${q.sentence}</div>
          <div class="ans-row">
            <input class="ans-input" id="input${i}" type="text" placeholder="正しい形を入力…" autocomplete="off" autocorrect="off" spellcheck="false" onkeydown="handleKey(event,${i},'D')">
            <button class="check-btn D" id="btn${i}" onclick="checkD(${i})">確認</button>
          </div>
          <div class="feedback" id="fb${i}"></div>
          <button class="model-btn" id="hintbtn${i}" onclick="showHint(${i},'${q.hint.replace(/'/g,"\\'")}')">💡 ヒント</button>
          <div class="model-answer" id="hint${i}"></div>
        </div>`;
    }
  });

  area.innerHTML = html;
  updateProgress();
}

function handleKey(e, i, type) {
  if (e.key === 'Enter') {
    if (type === 'A') checkA(i);
    else if (type === 'B') checkB(i);
    else if (type === 'D') checkD(i);
  }
}

function normalize(s) {
  return s.trim().toLowerCase().replace(/[.?!,]/g, '').replace(/\s+/g, ' ').trim();
}

function markResult(i, isOk, correctAns, inputId, btnId) {
  const input = document.getElementById(inputId || `input${i}`);
  const btn = document.getElementById(btnId || `btn${i}`);
  const fb = document.getElementById(`fb${i}`);

  if (input) { input.disabled = true; input.classList.add(isOk ? 'correct' : 'wrong'); }
  if (btn) btn.disabled = true;

  if (isOk) {
    state.correct++;
    fb.className = 'feedback ok';
    fb.textContent = `✓ 正解！ ${correctAns}`;
  } else {
    state.wrong++;
    fb.className = 'feedback ng';
    fb.textContent = `✗ 不正解。正しい答え：${correctAns}`;
  }

  state.answers[i] = true;
  updateProgress();
  checkAllDone();
  scrollToNext(i);
}

function selectChip(qi, wi) {
  if (state.answers[qi]) return;
  const d = window._chipData[qi];
  if (d.selected.includes(wi)) return;
  d.selected.push(wi);
  // mark chip as used
  document.getElementById(`chip${qi}_${wi}`).classList.add('used');
  renderSlots(qi);
}

function removeFromSlot(qi, slotIdx) {
  if (state.answers[qi]) return;
  const d = window._chipData[qi];
  const wi = d.selected[slotIdx];
  d.selected.splice(slotIdx, 1);
  document.getElementById(`chip${qi}_${wi}`).classList.remove('used');
  renderSlots(qi);
}

function renderSlots(qi) {
  const d = window._chipData[qi];
  const slotsEl = document.getElementById(`slots${qi}`);
  if (d.selected.length === 0) {
    slotsEl.classList.remove('has-words');
    slotsEl.innerHTML = '<span class="slot-placeholder">ここに単語が並びます</span>';
  } else {
    slotsEl.classList.add('has-words');
    slotsEl.innerHTML = d.selected.map((wi, si) =>
      `<span class="slot-chip" onclick="removeFromSlot(${qi},${si})">${d.shuffled[wi]}</span>`
    ).join('');
  }
}

function clearSlots(qi) {
  if (state.answers[qi]) return;
  const d = window._chipData[qi];
  d.selected.forEach(wi => document.getElementById(`chip${qi}_${wi}`).classList.remove('used'));
  d.selected = [];
  renderSlots(qi);
}

function checkA(i) {
  if (state.answers[i]) return;
  const q = TYPE_A[i];
  const d = window._chipData[i];
  if (!d || d.selected.length === 0) return;
  const given = d.selected.map(wi => d.shuffled[wi]).join(' ');
  const isOk = normalize(given) === normalize(q.answer);
  // disable all chips and slots
  d.selected.forEach(wi => {
    const el = document.getElementById(`chip${i}_${wi}`);
    if (el) el.style.pointerEvents = 'none';
  });
  document.getElementById(`slots${i}`).style.pointerEvents = 'none';
  markResult(i, isOk, q.answer);
}

function checkB(i) {
  if (state.answers[i]) return;
  const q = TYPE_B[i];
  const given = document.getElementById(`input${i}`).value;
  if (!given.trim()) return;
  const isOk = given.trim().toLowerCase() === q.answer.toLowerCase();
  markResult(i, isOk, q.answer);
}

function checkC(i) {
  if (state.answers[i]) return;
  const input = document.getElementById(`input${i}`);
  const given = input.value.trim();
  if (!given) return;

  input.disabled = true;
  document.getElementById(`btn${i}`).disabled = true;
  state.answers[i] = true;
  state.correct++; // writing: always give credit, show model answer

  const fb = document.getElementById(`fb${i}`);
  fb.className = 'feedback info';
  fb.textContent = '✓ 提出しました！模範解答と比べてみよう。';

  const modelbtn = document.getElementById(`modelbtn${i}`);
  if (modelbtn) modelbtn.style.display = 'inline-block';

  updateProgress();
  checkAllDone();
  scrollToNext(i);
}

function checkD(i) {
  if (state.answers[i]) return;
  const q = TYPE_D[i];
  const given = document.getElementById(`input${i}`).value;
  if (!given.trim()) return;
  const isOk = given.trim().toLowerCase() === q.answer.toLowerCase();
  markResult(i, isOk, q.answer);
}

function showHintById(i) {
  const q = TYPE_B[i];
  showHint(i, q.hint);
}

function showHintA(i) {
  const q = TYPE_A[i];
  showHint(i, q.hint);
}

function toggleJp(i) {
  const el = document.getElementById('jp' + i);
  const btn = document.getElementById('jpbtn' + i);
  el.classList.toggle('visible');
  btn.textContent = el.classList.contains('visible') ? '🇯🇵 日本語訳を隠す' : '🇯🇵 日本語訳を見る（任意）';
}

function showHint(i, hint) {
  const el = document.getElementById(`hint${i}`);
  const btn = document.getElementById(`hintbtn${i}`);
  el.textContent = hint;
  el.classList.add('visible');
  if (btn) btn.style.display = 'none';
}

function showModel(i) {
  const el = document.getElementById(`model${i}`);
  const btn = document.getElementById(`modelbtn${i}`);
  el.classList.add('visible');
  if (btn) btn.style.display = 'none';
}

function updateProgress() {
  const total = TYPE_DATA[currentType].length;
  const answered = Object.keys(state.answers).length;
  const pct = Math.round(answered / total * 100);
  document.getElementById('progFill').style.width = pct + '%';
  document.getElementById('progLabel').textContent = `${answered} / ${total}`;
  document.getElementById('scoreCorrect').textContent = `✓ ${state.correct}`;
  document.getElementById('scoreWrong').textContent = `✗ ${state.wrong}`;
}

function checkAllDone() {
  const total = TYPE_DATA[currentType].length;
  if (Object.keys(state.answers).length === total) {
    const finBtn = document.getElementById('finishBtn');
    finBtn.classList.add('visible');
    setTimeout(() => window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' }), 300);
  }
}

function scrollToNext(i) {
  const total = TYPE_DATA[currentType].length;
  for (let j = i + 1; j < total; j++) {
    if (!state.answers[j]) {
      setTimeout(() => {
        const el = document.getElementById(`qblock${j}`);
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }, 300);
      break;
    }
  }
}

function showResult() {
  const total = TYPE_DATA[currentType].length;
  const pct = currentType === 'C' ? 100 : Math.round(state.correct / total * 100);
  let emoji, title;
  if (pct === 100)    { emoji='🌟'; title='満点！Perfect!'; }
  else if (pct >= 80) { emoji='🏆'; title='Great job!'; }
  else if (pct >= 60) { emoji='📝'; title='Good! Keep practicing!'; }
  else                { emoji='💪'; title='もう一度チャレンジしよう！'; }

  document.getElementById('resultEmoji').textContent = emoji;
  document.getElementById('resultTitle').textContent = title;
  document.getElementById('resultSub').textContent = `${TYPE_LABELS[currentType]} · ${total}問`;
  document.getElementById('rCorrect').textContent = currentType === 'C' ? total : state.correct;
  document.getElementById('rWrong').textContent = currentType === 'C' ? '—' : state.wrong;
  document.getElementById('rPct').textContent = pct + '%';

  const retryBtn = document.getElementById('retryBtn');
  retryBtn.className = `btn-primary ${currentType}`;

  showScreen('resultScreen');
}

function retryType() { startType(currentType); }

</script>
</body>
</html>
