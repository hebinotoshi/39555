<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Material Flashcards</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    
    <style>
        :root {
            --md-primary: #6200ee;
            --md-surface: #ffffff;
            --md-background: #f5f5f5;
            --md-text-primary: rgba(0, 0, 0, 0.87);
            --md-text-secondary: rgba(0, 0, 0, 0.6);
            --md-shadow: 0px 4px 5px 0px rgba(0,0,0,0.14), 0px 1px 10px 0px rgba(0,0,0,0.12), 0px 2px 4px -1px rgba(0,0,0,0.2);
        }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--md-background);
            color: var(--md-text-primary);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 90%;
            max-width: 500px;
            text-align: center;
            position: relative;
        }

        /* Setup Screen styles */
        .card-setup {
            background: var(--md-surface);
            padding: 24px;
            border-radius: 8px;
            box-shadow: var(--md-shadow);
            margin-bottom: 20px;
        }

        h1 { font-weight: 500; margin-top: 0; color: var(--md-primary); }

        .status-message {
            margin: 15px 0;
            font-size: 14px;
            color: #2e7d32;
            font-weight: 500;
        }
        
        .status-message.error {
            color: #c62828;
        }

        select, button {
            font-family: 'Roboto', sans-serif;
            font-size: 16px;
            padding: 10px 16px;
            border-radius: 4px;
            border: 1px solid #ccc;
            background: white;
            margin: 5px;
        }

        button.btn-primary {
            background-color: var(--md-primary);
            color: white;
            border: none;
            cursor: pointer;
            text-transform: uppercase;
            font-weight: 500;
            letter-spacing: 1.25px;
            box-shadow: 0px 3px 1px -2px rgba(0,0,0,0.2), 0px 2px 2px 0px rgba(0,0,0,0.14), 0px 1px 5px 0px rgba(0,0,0,0.12);
            transition: box-shadow 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        button.btn-primary:hover {
            box-shadow: var(--md-shadow);
        }

        /* Top Bar for Game Screen Controls */
        .game-top-bar {
            display: flex;
            justify-content: flex-start;
            margin-bottom: 10px;
            width: 100%;
        }

        button.btn-icon {
            background: none;
            border: none;
            color: var(--md-text-secondary);
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s, color 0.2s;
        }

        button.btn-icon:hover {
            background-color: rgba(0, 0, 0, 0.04);
            color: var(--md-primary);
        }

        /* Flashcard styles */
        .game-section {
            display: none;
            width: 100%;
        }

        .flashcard-wrapper {
            perspective: 1000px;
            width: 100%;
            height: 250px;
            margin: 10px 0 20px 0;
            cursor: pointer;
        }

        .flashcard {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .flashcard.flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 8px;
            box-shadow: var(--md-shadow);
            background: var(--md-surface);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
            padding: 24px;
        }

        .card-front {
            color: var(--md-primary);
        }

        .card-back {
            transform: rotateY(180deg);
            background-color: #fafafa;
        }

        .word { font-size: 26px; font-weight: 400; line-height: 1.4; }
        .label { font-size: 12px; color: var(--md-text-secondary); text-transform: uppercase; margin-bottom: 10px;}

        /* Controls */
        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
        }

        .progress {
            color: var(--md-text-secondary);
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="container">
    <div id="setup-screen" class="card-setup">
        <h1>Flashcard Setup</h1>
        
        <div id="status-text" class="status-message">Fetching vocabulary...</div>

        <div>
            <label for="card-count">Cards to play:</label>
            <select id="card-count">
                <option value="50">50</option>
                <option value="100">100</option>
                <option value="200">200</option>
                <option value="all">All Cards</option>
            </select>
        </div>
        <br>
        <button id="start-btn" class="btn-primary" onclick="startGame()" disabled>Start Game</button>
    </div>

    <div id="game-screen" class="game-section">
        <div class="game-top-bar">
            <button class="btn-icon" onclick="goHome()" title="Go Home">
                <span class="material-icons">home</span>
            </button>
        </div>

        <div class="flashcard-wrapper" onclick="flipCard()">
            <div id="flashcard" class="flashcard">
                <div class="card-face card-front">
                    <span class="label">English</span>
                    <span id="front-text" class="word">Word</span>
                </div>
                <div class="card-face card-back">
                    <span class="label">Japanese</span>
                    <span id="back-text" class="word">意味</span>
                </div>
            </div>
        </div>
        
        <div class="controls">
            <button class="btn-primary" onclick="prevCard()"><span class="material-icons">arrow_back</span></button>
            <span id="progress-text" class="progress">0 / 0</span>
            <button class="btn-primary" onclick="nextCard()"><span class="material-icons">arrow_forward</span></button>
        </div>
    </div>
</div>

<script>
    let rawCards = [];
    let gameCards = [];
    let currentIndex = 0;

    // Automatically fetch vocab.csv from the server on load
    window.addEventListener('DOMContentLoaded', () => {
        fetch('vocab.csv')
            .then(response => {
                if (!response.ok) {
                    throw new Error('Could not find vocab.csv on the server.');
                }
                return response.text();
            })
            .then(text => {
                parseTestData(text);
                if (rawCards.length > 0) {
                    const statusEl = document.getElementById('status-text');
                    statusEl.textContent = `Loaded ${rawCards.length} words successfully!`;
                    document.getElementById('start-btn').disabled = false;
                } else {
                    throw new Error('vocab.csv is empty or format mismatch.');
                }
            })
            .catch(error => {
                const statusEl = document.getElementById('status-text');
                statusEl.classList.add('error');
                statusEl.innerHTML = `<strong>Error:</strong> ${error.message}`;
            });
    });

    function parseTestData(text) {
        rawCards = [];
        const lines = text.split('\n');
        
        lines.forEach(line => {
            if (!line.trim()) return;
            
            const firstCommaIndex = line.indexOf(',');
            
            if (firstCommaIndex !== -1) {
                const enPart = line.substring(0, firstCommaIndex).trim();
                const jpPart = line.substring(firstCommaIndex + 1).trim();
                
                rawCards.push({
                    en: enPart,
                    jp: jpPart
                });
            }
        });
    }

    function startGame() {
        if (rawCards.length === 0) return;

        let shuffled = [...rawCards].sort(() => 0.5 - Math.random());
        
        const choice = document.getElementById('card-count').value;
        const count = choice === 'all' ? shuffled.length : parseInt(choice);
        const actualCount = Math.min(count, shuffled.length);
        
        gameCards = shuffled.slice(0, actualCount);
        currentIndex = 0;

        document.getElementById('setup-screen').style.display = 'none';
        document.getElementById('game-screen').style.display = 'block';
        
        updateCard();
    }

    function updateCard() {
        if(gameCards.length === 0) return;
        
        document.getElementById('flashcard').classList.remove('flipped');
        
        setTimeout(() => {
            document.getElementById('front-text').textContent = gameCards[currentIndex].en;
            document.getElementById('back-text').textContent = gameCards[currentIndex].jp;
            document.getElementById('progress-text').textContent = `${currentIndex + 1} / ${gameCards.length}`;
        }, 150);
    }

    function flipCard() {
        document.getElementById('flashcard').classList.toggle('flipped');
    }

    function nextCard() {
        if (currentIndex < gameCards.length - 1) {
            currentIndex++;
            updateCard();
        }
    }

    function prevCard() {
        if (currentIndex > 0) {
            currentIndex--;
            updateCard();
        }
    }

    // New function to return to the setup dashboard
    function goHome() {
        // Reset card orientation so it doesn't stay flipped on the next game
        document.getElementById('flashcard').classList.remove('flipped');
        
        // Short timeout allows smooth flip transition animation if card was upside down
        setTimeout(() => {
            document.getElementById('game-screen').style.display = 'none';
            document.getElementById('setup-screen').style.display = 'block';
        }, 150);
    }
</script>
</body>
</html>
